# pygeoapi-konfigurasjon — generert fra datamodellen og metadata i Geonorge.
# Verdier merket "<REPLACE_ME>" må fylles inn før tjenesten kan startes.
server:
  bind:
    host: 0.0.0.0
    port: 5000
  cors: false
  url: ${PYGEOAPI_SERVER_URL:-http://localhost:5000}
  mimetype: application/json; charset=UTF-8
  encoding: utf-8
  gzip: false
  languages:
  - nb-NO
  pretty_print: true
  admin: ${PYGEOAPI_SERVER_ADMIN:-false}
  limits:
    default_items: 20
    max_items: 100
  map:
    url: https://tile.openstreetmap.org/{z}/{x}/{y}.png
    attribution: '&copy; <a href="https://openstreetmap.org/copyright">OpenStreetMap
      contributors</a>'
logging:
  level: ERROR
metadata:
  identification:
    title: Vrak og hefter i sjøkart
    description: "Datasettet angir geografisk posisjon for vrak og hefter i sjøkartene\
      \ langs i norske kyst og havområder og på Svalbard. \nDatasettet inneholder\
      \ informasjon om posisjon og informasjon om vraket er farlig for navigasjon.\n\
      Vrak er pr definisjon de ødelagte restene av et strandet eller sunket fartøy\
      \ som har blitt ubrukelig.\nHefte er pr definisjon uren bunn pga hindring for\
      \ seilas, eller rester av skrot, vrak og annet på sjøbunnen som kan være til\
      \ hinder.\nFormålet med datasettet er å redusere risiko for skade på vrak, overseilende\
      \ fartøy, fiskeredskap og bidra til kyst- og fiskeriforvaltning, arealplanlegging,\
      \ samferdsel og samfunnssikkerhet.\nVrak og hefter i sjøkart er et datasett\
      \ som kan være nyttige å ha som underliggende informasjon når en skal planlegge\
      \ aktiviteter i norske kyst- og havområder.\n\nVrak og hefter publiseres i dag\
      \ i navigasjonsproduktene sjøkart og elektroniske sjøkart. De publiseres også\
      \ i karttjenesten i Den norske los. \nDatasettet forvaltes kontinuerlig og publiseres\
      \ av Kartverket."
    keywords:
    - Vrak
    - Hefte
    - Forurenset sjøbunn
    - Uren sjøbunn
    - HefteUrenBunn
    - Arealbruk
    - Nautisk informasjon
    - Det offentlige kartgrunnlaget
    - geodataloven
    - Kyst og fiskeri
    - Plan
    - Samfunnssikkerhet
    - Forurensning
    - Vrakgrense
    - vraktype
    - vertikalDatum
    - hefteUrenBunntype
    keywords_type: theme
    terms_of_service: Åpne data
    url: https://kartkatalog.geonorge.no/metadata/a5821b74-096d-4923-aa3c-387cfa0e6218
  license:
    name: Creative Commons BY 4.0 (CC BY 4.0)
    url: https://creativecommons.org/licenses/by/4.0/
  provider:
    name: Kartverket
    url: "<REPLACE_ME>"
  contact:
    name: Kartverket
    email: kundesenter@kartverket.no
    url: "<REPLACE_ME>"
