# pygeoapi-konfigurasjon — generert fra datamodellen og metadata i Geonorge.
# Verdier merket "<REPLACE_ME>" må fylles inn før tjenesten kan startes.
server:
  bind:
    host: 0.0.0.0
    port: 5000
  cors: false
  url: ${PYGEOAPI_SERVER_URL:-http://localhost:5000}
  mimetype: application/json; charset=UTF-8
  encoding: utf-8
  gzip: false
  languages:
  - nb-NO
  pretty_print: true
  admin: ${PYGEOAPI_SERVER_ADMIN:-false}
  limits:
    default_items: 20
    max_items: 100
  map:
    url: https://tile.openstreetmap.org/{z}/{x}/{y}.png
    attribution: '&copy; <a href="https://openstreetmap.org/copyright">OpenStreetMap
      contributors</a>'
logging:
  level: ERROR
metadata:
  identification:
    title: Tettsteder
    description: "Datasettet viser Tettsteder pr. 01.01 for årsversjon. Det er DOK-datasett.\
      \ Tettsteder er geografiske områder som har en dynamisk avgrensing, og antall\
      \ tettsteder og deres yttergrenser vil endre seg over tid avhengig av byggeaktivitet\
      \ og befolkningsutvikling. \nEt tettsted er en hussamling med minst 200 bosatte\
      \ og der avstanden mellom husene normalt ikke skal overstige 50 meter. Les mer\
      \ om tettsted og fullstendig definisjon her: https://www.ssb.no/befolkning/folketall/statistikk/tettsteders-befolkning-og-areal\n\
      \nDataene er tilgjengelig for innsyn og nedlasting fra Geonorge\nÅrsdatasett\
      \ er også nedlastbar fra SSBs kartportal https://kart.ssb.no  > Se eget Tema\
      \ \"Tettsteder\" eller gå til \"Innholdskatalog\" for oversikt over alle tilgjengelig\
      \ datasett"
    keywords:
    - tettsted
    - befolkning
    - tettstedsavgrensninger
    - statistikk
    - Arealbruk
    - Norge digitalt
    - geodataloven
    - Inspire
    - fellesDatakatalog
    keywords_type: theme
    terms_of_service: Åpne data
    url: https://kartkatalog.geonorge.no/metadata/173f4a15-dead-4f82-b92e-f37396b72cea
  license:
    name: Norsk lisens for offentlige data (NLOD)
    url: http://data.norge.no/nlod/no/1.0
  provider:
    name: Statistisk sentralbyrå
    url: "<REPLACE_ME>"
  contact:
    name: Statistisk sentralbyrå
    email: svein.reid@ssb.no
    url: "<REPLACE_ME>"
