          - value: Vertikale bånd
            label: to-fargete alternerende vertikale bånd
          - value: Ukjent
            label: Ukjent
          - value: Annet
            label: Annet
        description: mønster til merkingen
        required: true
      - name: kommentarMerkingMønster
        logicalType: string
        description: hvis "Annet" velges på merkingMønster skal dette spesifiseres
          her
      - name: merkingICAO
        logicalType: string
        logicalTypeOptions:
          pattern: ^(Ja|Nei|Ukjent)$
        customProperties:
        - property: allowedValues
          value:
          - value: Ja
            label: Ja
          - value: Nei
            label: Nei
          - value: Ukjent
            label: Ukjent
        description: hvorvidt merking er ihht. ICAO standard
      - name: merkingTilstand
        logicalType: string
        logicalTypeOptions:
          pattern: ^(Dårlig|Brukbar|God|Veldig\ god|Ukjent)$
        customProperties:
        - property: allowedValues
          value:
          - value: Dårlig
            label: Merkingen er vanskelig å se.
          - value: Brukbar
            label: Merkingen er mulig å se, men utydelig.
          - value: God
            label: Merkingen er godt synlig.
          - value: Veldig god
            label: Merkingen er meget godt synlig.
          - value: Ukjent
            label: Tilstanden til merking er ukjent.
