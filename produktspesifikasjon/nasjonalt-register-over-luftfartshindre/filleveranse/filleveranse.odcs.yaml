          i bulk


          tilsvarer klasse Petroleumsinnretning i SOSI Petroleum 4.0'
      - value: Silo
        label: 'lagringsbygg for fôr og korn som ikke er registrert som bygning i
          GAB


          tilsvarer klasse Silo i SOSI Bygnan 4.0


          Merknad: I motsetning til definisjonen av klasse Silo i SOSI Bygnan 4.0
          vil dette også gjelde store silobygg'
      - value: Stolheis
        label: 'taubane med stoler til persontransport


          tilsvarer klasse Stolheis i SOSI Bygnan 4.0'
      - value: Skitrekk
        label: 'taubane til å dra skiløper opp bratte bakker


          tilsvarer klasse Skitrekk i SOSI Bygnan 4.0'
      - value: Taubane
        label: 'innretning hvor tau eller vaiere bærer og eller trekker last over
          en strekning


          tilsvarer klasse Taubane i SOSI Bygnan 4.0'
      - value: Fornøyelsesparkinnretning
        label: pariserhjul, berg og dal bane og andre høye innretninger i en fornøyelsespark
      - value: Annet
        label: Annet
    description: her angis det hvilken type vertikalt objekt dette objektet er, se
      egen kodeliste
    required: true
  - name: identifikasjonObjekt
    logicalType: object
    properties:
    - name: lokalId
      logicalType: string
      description: 'lokal identifikator, tildelt av dataleverendør/dataforvalter.
        Den lokale identifikatoren er unik innenfor navnerommet, ingen andre objekter
        har samme identifikator.


        Merknad: Det er data leverendørens ansvar å sørge for at denne lokale identifikatoren
        er unik innenfor navnerommet.'
      required: true
    - name: navnerom
      logicalType: string
      description: 'navnerom som unikt identifiserer datakilden til objektet, starter
        med to bokstavs kode jfr ISO 3166. Benytter understreking  ("_") dersom data
        produsenten ikke er assosiert med bare et land.


        Merknad : Verdien for nanverom vil eies av den dataprodusent som har ansvar
        for de unike identifikatorene og vil registreres i "INSPIRE external  Object
        Identifier Namespaces Register"


        Eksempel: NO for Norge.'
      required: true
    - name: versjonId
      logicalType: string
      description: 'identifikasjon av en spesiell versjon av et geografisk objekt
        (instans), maksimum lengde på 25 karakterer. Dersom spesifikasjonen av et
        geografisk objekt med en identifikasjon inkludererer livsløpssyklusinformasjon,
        benyttes denne versjonId for å skille mellom ulike versjoner av samme objekt.
        versjonId er en unik  identifikasjon av versjonen.


        Merknad: Maksimum lengde er valgt for å tillate tidsregistrering i henhold
        til  ISO 8601, slik som  "2007-02-12T12:12:12+05:30" som versjonId.'
    description: unik identifikasjon av et objekt
    required: true
