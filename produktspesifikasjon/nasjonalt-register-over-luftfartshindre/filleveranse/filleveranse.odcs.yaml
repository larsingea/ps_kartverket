              hvit|Trafikkhvit|Oransje|Rødt|Hvitt|Annet)$
          customProperties:
          - property: allowedValues
            value:
            - value: Svovelgul
              label: RAL 1016 (Sulfur yellow)
            - value: Trafikkrød
              label: RAL 3020 (Traffic red)
            - value: Lysende rød
              label: RAL 3024 (Luminous red)
            - value: Lys grå
              label: RAL 7035 (Light grey)
            - value: Agatgrå
              label: RAL 7038 (Agate grey)
            - value: Signalhvit
              label: RAL 9003 (Signal white)
            - value: Ren hvit
              label: RAL 9010 (Pure white)
            - value: Trafikkhvit
              label: RAL 9016 (Traffic white)
            - value: Oransje
              label: RAL kode ikke aktuelt, kode er videreført fra gammelt system
            - value: Rødt
              label: RAL kode ikke aktuelt, kode er videreført fra gammelt system
            - value: Hvitt
              label: RAL kode ikke aktuelt, kode er videreført fra gammelt system
            - value: Annet
