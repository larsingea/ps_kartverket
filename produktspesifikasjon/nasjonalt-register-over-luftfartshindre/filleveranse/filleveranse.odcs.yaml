          og ikke hjelpemidler til andre form for navigasjon, som for eksempel til
          sjøs.'
      - value: Stolpe
        label: hentet fra AIXM 5.1 klasse CodeVerticalStructureType, kode POLE
      - value: Kraftverk
        label: hentet fra AIXM 5.1 klasse CodeVerticalStructureType, kode POWER_PLANT
      - value: Raffineri
        label: hentet fra AIXM 5.1 klasse CodeVerticalStructureType, kode REFINERY
      - value: Oljerigg
        label: hentet fra AIXM 5.1 klasse CodeVerticalStructureType, kode RIG
      - value: Skilt
        label: hentet fra AIXM 5.1 klasse CodeVerticalStructureType, kode SIGN
      - value: Pipe
        label: hentet fra AIXM 5.1 klasse CodeVerticalStructureType, kode STACK
      - value: Tank
        label: hentet fra AIXM 5.1 klasse CodeVerticalStructureType, kode TANK
      - value: Forankret ballong
        label: hentet fra AIXM 5.1 klasse CodeVerticalStructureType, kode TETHERED_BALLOON
      - value: Tårn
        label: hentet fra AIXM 5.1 klasse CodeVerticalStructureType, kode TOWER
      - value: Kraftledning
        label: 'linje som fører elektrisk kraft over store avstander


          tilsvarer klasse LuftledningLH i SOSI Ledningsnett 4.0 og kodene "Høgspentnett"
          og "Lavspentnett" i kodelista Ledningsnettverkstype i SOSI Ledningsnett
          4.5


          tilsvarer også kode TRANSMISSION_LINE

          hentet fra AIXM 5.1 klasse CodeVerticalStructureType'
      - value: Tre
        label: hentet fra AIXM 5.1 klasse CodeVerticalStructureType, kode TREE
      - value: Skogsområde
        label: 'hentet fra AIXM 5.1 klasse CodeVerticalStructureType, kode VEGETATION


          gjelder også klasse lufthavnhinderTregruppe i SOSI Lufthavn 4.1'
      - value: Vanntårn
        label: hentet fra AIXM 5.1 klasse CodeVerticalStructureType, kode WATER_TOWER
      - value: Vindmølle
        label: hentet fra AIXM 5.1 klasse CodeVerticalStructureType, kode WINDMILL
      - value: Vindmøllepark
        label: hentet fra AIXM 5.1 klasse CodeVerticalStructureType, kode WINDMILL_FARMS
      - value: Hopptårn
        label: 'tilsvarer klasse Hoppbakke i SOSI Bygnan 4.0


          ikke dommertårnet'
      - value: Vindmåler
