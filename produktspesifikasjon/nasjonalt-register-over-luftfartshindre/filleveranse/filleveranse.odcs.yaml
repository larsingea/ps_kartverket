          tilsvarer klasse MastTele i Ledningsnett 4.0'
      - value: Bru
        label: hentet fra AIXM 5.1 klasse CodeVerticalStructureType kode BRIDGE
      - value: Bygning
        label: hentet fra AIXM 5.1 klasse CodeVerticalStructureType kode BUILDING
      - value: Gondolbane
        label: hentet fra AIXM 5.1 klasse CodeVerticalStructureType kode CABLE_CAR
      - value: Kontrolltårn
        label: hentet fra AIXM 5.1 klasse CodeVerticalStructureType kode CONTROL_TOWER
      - value: Kjøletårn
        label: hentet fra AIXM 5.1 klasse CodeVerticalStructureType kode COOLING_TOWER
      - value: Kran
        label: 'hentet fra AIXM 5.1 klasse CodeVerticalStructureType


          gjelder også heisekrantypene skinnekran/havnekran, tårnkran/byggekran, mobilkran,
          flytekran'
      - value: Demning
        label: hentet fra AIXM 5.1 klasse CodeVerticalStructureType kode DAM
      - value: Kuppel
        label: hentet fra AIXM 5.1 klasse CodeVerticalStructureType kode DOME
      - value: EL_Nettstasjon
        label: 'stasjon som transformerer elektrisitet fra et høyspentnivå til et
          lavere


          tilsvarer EL_Transformatorstasjon og EL_Nettstasjon i SOSI Ledning 4.5


          Merk: Gjelder alle typer transformasjoner. I standarden for luftfartshinder
          skiller vi ikke mellom ulike typer transformasjoner som for eksempel transformasjon
          til lavere eller høyere enn 230 V slik det gjøres i SOSI Ledning 4.5.'
      - value: Gjerde
        label: hentet fra AIXM 5.1 klasse CodeVerticalStructureType kode FENCE
      - value: Fyrtårn
        label: hentet fra AIXM 5.1 klasse CodeVerticalStructureType kode LIGHTHOUSE
      - value: Monument
        label: hentet fra AIXM 5.1 klasse CodeVerticalStructureType, kode MONUMENT
      - value: Terrengpunkt
        label: hentet fra AIXM 5.1 klasse CodeVerticalStructureType, kode NATURAL_HIGHPOINT
      - value: Navigasjonshjelpemiddel
        label: 'hentet fra AIXM 5.1 klasse CodeVerticalStructureType, kode NAVAID


